<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Televisions | Khabbaz Trading</title>

    <link rel="stylesheet" href="style.css">
    <style>
    .category-products {
        width: 100% !important;
        padding: 40px 5% !important;
        box-sizing: border-box !important;
    }

    .category-products .products-grid {
        display: grid !important;
        grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
        gap: 25px !important;

        width: 100% !important;
        max-width: 1300px !important;
        margin: 0 auto !important;
        padding: 0 !important;

        overflow: visible !important;
    }

    .category-products .tv-card {
        width: 100% !important;
        min-width: 0 !important;
        max-width: none !important;
        margin: 0 !important;
    }

    .category-products .tv-card .product-image {
        width: 100% !important;
        height: auto !important;
    }

    .category-products .tv-card img {
        width: 100% !important;
        height: auto !important;
        display: block !important;
        border-radius: 16px !important;
    }
@media (max-width: 700px) {
        .category-products .products-grid {
            grid-template-columns: 1fr !important;
        }

        .category-products {
            padding: 25px 18px !important;
        }
    }
</style>
</head>

<body>

    <header class="site-header">
        <nav class="navbar">

            <a href="index.html" class="brand">
                <span class="brand-copy">
                    <strong>KHABBAZ</strong>
                    <small>TRADING</small>
                </span>
            </a>

            <a href="index.html" class="nav-button">
                HOME →
            </a>

        </nav>
    </header>


    <main class="category-page">

        <section class="category-hero">

            <p>KHABBAZ TRADING</p>

            <h1>
                Televisions
            </h1>

            <span>
                Discover our available TV models
            </span>

        </section>


        <section class="category-products">
<div class="products-grid">
    <article class="product-card tv-card">
        <div class="product-image">
            <img src="tv32.jpg" alt="Smart LED TV 32">
        </div>
    </article>
    <article class="product-card tv-card">
        <div class="product-image">
            <img src="tv39.jpg" alt="Smart LED TV 39">
        </div>
    </article>
<article class="product-card tv-card">
    <div class="product-image">
        <img src="tv43.jpg" alt="Smart LED TV 43">
    </div>
</article>

<article class="product-card tv-card">
    <div class="product-image">
        <img src="tv50.jpg" alt="Smart LED TV 50">
    </div>
</article>

<article class="product-card tv-card">
    <div class="product-image">
        <img src="tv55.jpg" alt="Smart LED TV 55">
    </div>
</article>

<article class="product-card tv-card">
    <div class="product-image">
        <img src="tv60.jpg" alt="Smart LED TV 60">
    </div>
</article>

<article class="product-card tv-card">
    <div class="product-image">
        <img src="tv65.jpg" alt="Smart LED TV 65">
    </div>
</article>
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
